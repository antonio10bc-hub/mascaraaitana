<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Máscara">

<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: columna centrada; saludo, cabecera fija en una línea, vista Mes (7×6) o Año (12 mini meses) */
:root{
  --bg:#f6f7f9;--surface:#ffffff;--fg:#14171c;--muted:#6b7280;--line:#e3e6eb;
  --mark:#d9705b;--ret:#5b84c4;--gly:#5aa679;--mark-fg:#ffffff;--today:#14171c;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a20;--fg:#e8eaee;--muted:#8a919c;--line:#262a32;
  --mark:#e27e69;--ret:#6f96d4;--gly:#6bb88a;--mark-fg:#ffffff;--today:#e8eaee;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a20;--fg:#e8eaee;--muted:#8a919c;--line:#262a32;
  --mark:#e27e69;--ret:#6f96d4;--gly:#6bb88a;--mark-fg:#ffffff;--today:#e8eaee;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hello{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);padding:0;overflow:hidden;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);transition:transform .4s var(--spring)}
.avatar:active{transform:scale(.9);transition-duration:.1s}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.login img{width:76px;height:76px;border-radius:18px}
.login h2{margin:6px 0 0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.login p{margin:0;color:var(--muted);font-size:14px;max-width:280px}
.login #gbtn{min-height:44px;margin-top:10px}
.login .err{color:var(--mark);font-size:13px;min-height:1em}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px}
h1{margin:4px 0 0;font-size:clamp(20px,6vw,28px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 span{color:var(--muted);font-weight:400}
.nav{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;height:36px;min-width:36px;padding:0 10px;font-size:13px;font-weight:500;white-space:nowrap;transition:transform .4s var(--spring),border-color .2s ease}
.btn:active{transform:scale(.92);transition-duration:.1s}
.seg{position:relative;display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;align-self:flex-start}
.seg .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:6px;background:var(--fg);transition:transform .42s cubic-bezier(.3,1.2,.5,1),width .42s cubic-bezier(.3,1.2,.5,1)}
.seg button{position:relative;z-index:1;border:0;background:transparent;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted);transition:color .3s ease}
.seg button[aria-pressed="true"]{color:var(--bg)}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.vp{position:relative;touch-action:pan-y}
.vp.swapping{overflow:hidden;margin:-6px;padding:6px}
.leaving{position:absolute;top:6px;left:6px;right:6px;pointer-events:none}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow div{text-align:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0 8px;font-weight:500;white-space:nowrap;overflow:hidden}
.day{aspect-ratio:1;width:100%;min-width:0;border:0;border-radius:8px;background:transparent;isolation:isolate;transition:transform .45s var(--spring),color .3s ease,background-color .2s ease;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.day.out{color:var(--muted);opacity:.35}
.day.today::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--today);transition:background-color .3s ease}
.day::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--fill,var(--mark));z-index:-1;opacity:0;transform:scale(.55);transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .28s ease}
.day.on{color:var(--mark-fg)}
.day.on::before{opacity:1;transform:scale(1);transition:transform .5s var(--spring),opacity .18s ease}
.day:active{transform:scale(.9);transition-duration:.12s}
.day.on.today::after{background:var(--mark-fg)}
@media (hover:hover){.btn:hover{border-color:var(--muted)}.day:not(.on):hover{background:var(--line)}.mini:hover{border-color:var(--muted)}}
.year{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:480px){.year{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mini{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .45s var(--spring),border-color .2s ease}
.mini:active{transform:scale(.96);transition-duration:.12s}
.mini.cur{border-color:var(--fg)}
.mini.lift{z-index:2}
.mini h3{margin:0;font-size:12px;font-weight:600;display:flex;justify-content:space-between;white-space:nowrap}
.mini h3 em{font-style:normal;font-family:var(--mono);font-weight:500;color:var(--mark)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mgrid i{aspect-ratio:1;border-radius:3px;font-style:normal;font-family:var(--mono);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-variant-numeric:tabular-nums}
.mgrid i.on{background:var(--fill,var(--mark));color:var(--mark-fg)}
.t-m{--fill:var(--mark)}.t-r{--fill:var(--ret)}.t-g{--fill:var(--gly)}
.t-mr{--fill:linear-gradient(90deg,var(--mark) 50%,var(--ret) 50%)}
.t-mg{--fill:linear-gradient(90deg,var(--mark) 50%,var(--gly) 50%)}
.pick-bg{position:fixed;inset:0;z-index:20}
.pick{position:fixed;z-index:21;width:224px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);display:flex;flex-direction:column}
.pick button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:10px;font-size:14px;text-align:left;transition:background-color .15s ease,transform .3s var(--spring)}
.pick button:active{background:var(--line);transform:scale(.97)}
.pick .sq{width:18px;height:18px;border-radius:5px;background:var(--fill);flex:none}
.pick .sq.none{background:none;border:1.5px dashed var(--muted)}
.pick .ck{margin-left:auto;color:var(--muted);font-size:13px}
.pick hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.mgrid i.today{outline:1px solid var(--fg);color:var(--fg)}
.stats{display:flex;gap:24px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{display:inline-block;font-family:var(--mono);font-weight:500;color:var(--fg);font-size:15px;margin-right:4px}
.status{font-size:12px;color:var(--muted);min-height:1em}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted);padding-top:4px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--fill)}
.legend p{flex-basis:100%;margin:2px 0 0;font-size:11px}
.remind{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;transition:transform .45s var(--spring),border-color .2s ease}
.remind:active{transform:scale(.98);transition-duration:.12s}
.remind span{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:500}
.remind small{font-size:12px;font-weight:400;color:var(--muted)}
.sw{flex:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background-color .3s ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .4s var(--spring)}
.remind[aria-checked="true"] .sw{background:var(--mark)}
.remind[aria-checked="true"] .sw::after{transform:translateX(16px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="hello" id="hello">Hola Aitana :)</p>
    <button class="avatar" id="avatar" aria-label="Cuenta" hidden></button>
  </div>
  <div class="seg" role="group" aria-label="Vista">
    <span class="ind" id="ind" aria-hidden="true"></span>
    <button id="vMonth" aria-pressed="true">Mes</button>
    <button id="vYear" aria-pressed="false">Año</button>
  </div>
  <header>
    <div style="min-width:0">
      <h1 id="title"></h1>
    </div>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Anterior">‹</button>
      <button class="btn" id="todayBtn">Hoy</button>
      <button class="btn" id="next" aria-label="Siguiente">›</button>
    </div>
  </header>
  <div class="cal" id="monthView">
    <div class="dow"><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div></div>
    <div class="vp" id="mvp"></div>
  </div>
  <div class="vp" id="yearView" hidden></div>
  <div class="stats">
    <div id="sMonth"><b id="cMonth">0</b>días este mes</div>
    <div><b id="cYear">0</b>días en el año</div>
  </div>
  <button class="remind" id="remind" role="switch" aria-checked="false" hidden>
    <span>Recordatorio diario<small id="remindTxt">Cada noche a las 21:00 · Sí / No</small></span>
    <i class="sw" aria-hidden="true"></i>
  </button>
  <div class="status" id="status"></div>
  <div class="legend" aria-label="Leyenda">
    <span><i class="t-m"></i>Máscara</span>
    <span><i class="t-mr"></i>Máscara + retinol</span>
    <span><i class="t-mg"></i>Máscara + glicólico</span>
    <span><i class="t-r"></i>Retinol</span>
    <span><i class="t-g"></i>Glicólico</span>
    <p>Toque: máscara · Mantén pulsado: elegir</p>
  </div>
</div>
<div class="login" id="login" hidden>
  <img src="/icon.svg" alt="">
  <h2>Calendario Máscara</h2>
  <p>Inicia sesión para guardar tus días y verlos en todos tus dispositivos.</p>
  <div id="gbtn"></div>
  <div class="err" id="loginErr"></div>
</div>
<div class="pick-bg" id="pickBg" hidden></div>
<div class="pick" id="pick" role="menu" hidden></div>

<script>
const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const now=new Date();
let y=now.getFullYear(),m=now.getMonth(),view="month",first=true;
let marks=new Map();
/* Tipo por día: m=máscara, mr=máscara+retinol, mg=máscara+glicólico, r=retinol, g=glicólico. Guardado "AAAA-MM-DD" (m) o "AAAA-MM-DD:tipo" */
const TYPES=[["m","Máscara"],["mr","Máscara + retinol"],["mg","Máscara + glicólico"],["r","Retinol"],["g","Glicólico"]];
const OLD={"2":"mr","3":"mg"};
const toArr=()=>[...marks].map(([k,t])=>t==="m"?k:`${k}:${t}`);
const fromArr=a=>new Map(a.filter(s=>typeof s==="string").map(s=>{let[k,t]=s.split(":");t=OLD[t]||t||"m";return[k,TYPES.some(x=>x[0]===t)?t:"m"]}));
const hasMask=t=>!!t&&t[0]==="m";
const storeLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(toArr()))}catch(e){}};
const lvlClass=t=>t?" on t-"+t:"";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=(Y,M,D)=>`${Y}-${pad(M+1)}-${pad(D)}`;
const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());
let LS="mascara-luces-marks";const LEGACY_LS=LS,USER_LS="mascara-luces-user";let user=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE="cubic-bezier(.2,.8,.2,1)";
try{const s=JSON.parse(localStorage.getItem(LS)||"[]");if(Array.isArray(s))marks=fromArr(s)}catch(e){}

function countIn(prefix){let c=0;marks.forEach((t,k)=>{if(hasMask(t)&&k.startsWith(prefix))c++});return c}
const curVp=()=>view==="month"?$("mvp"):$("yearView");

function buildMonth(){
  const g=document.createElement("div");g.className="grid";
  const first0=(new Date(y,m,1).getDay()+6)%7;
  for(let i=0;i<42;i++){
    const d=new Date(y,m,1-first0+i);
    const k=key(d.getFullYear(),d.getMonth(),d.getDate());
    const b=document.createElement("button");
    b.className="day"+(d.getMonth()!==m?" out":"")+(k===todayKey?" today":"")+lvlClass(marks.get(k));
    b.textContent=d.getDate();
    b.setAttribute("aria-pressed",marks.has(k));
    b.setAttribute("aria-label",`${d.getDate()} de ${MONTHS[d.getMonth()]}`);
    b.onclick=()=>{if(b._long){b._long=false;return}toggle(k,b);b.blur()};
    holdable(b,k);
    if(first&&!reduce)b.animate([{opacity:0,transform:"translateY(6px) scale(.94)"},{opacity:1,transform:"none"}],{duration:420,delay:i*7,easing:EASE,fill:"backwards"});
    g.appendChild(b);
  }
  return g;
}
function buildYear(){
  const yv=document.createElement("div");yv.className="year";
  for(let mm=0;mm<12;mm++){
    const card=document.createElement("button");
    card.className="mini"+(y===now.getFullYear()&&mm===now.getMonth()?" cur":"");
    const c=countIn(`${y}-${pad(mm+1)}-`);
    let cells="";
    const f=(new Date(y,mm,1).getDay()+6)%7, dim=new Date(y,mm+1,0).getDate();
    for(let i=0;i<f;i++)cells+="<i></i>";
    for(let d=1;d<=dim;d++){const k=key(y,mm,d);cells+=`<i class="${lvlClass(marks.get(k))}${k===todayKey?" today":""}">${d}</i>`}
    card.innerHTML=`<h3>${MONTHS[mm]}<em>${c||""}</em></h3><div class="mgrid">${cells}</div>`;
    card.setAttribute("aria-label",`Abrir ${MONTHS[mm]}`);
    card.onclick=()=>{const r=card.getBoundingClientRect();m=mm;setView("month",r)};
    yv.appendChild(card);
  }
  return yv;
}
const build=()=>view==="month"?buildMonth():buildYear();

function setTitle(dir){
  const t=$("title");t.innerHTML=view==="month"?`${MONTHS[m]} <span>${y}</span>`:`${y}`;
  if(dir&&!reduce)t.animate([{opacity:0,transform:`translateX(${dir*14}px)`},{opacity:1,transform:"none"}],{duration:380,easing:EASE});
}
function setCount(el,v,anim){
  const old=+el.textContent;
  if(old===v)return;
  el.getAnimations().forEach(a=>a.cancel());
  if(!anim||reduce){el.textContent=v;return}
  const d=v>old?1:-1;
  el.animate([{transform:"none",opacity:1},{transform:`translateY(${-d*60}%)`,opacity:0}],{duration:130,easing:"ease-in"})
    .onfinish=()=>{el.textContent=v;el.animate([{transform:`translateY(${d*60}%)`,opacity:0},{transform:"none",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.9,.3,1.25)"})};
}
function counts(anim){setCount($("cMonth"),countIn(`${y}-${pad(m+1)}-`),anim);setCount($("cYear"),countIn(`${y}-`),anim)}

function render(){
  setTitle(0);
  $("monthView").hidden=view!=="month";
  $("yearView").hidden=view!=="year";
  $("sMonth").hidden=view!=="month";
  const vp=curVp();vp.classList.remove("swapping");vp.replaceChildren(build());
  counts(false);
}

/* Cambio de mes/año con deslizamiento */
function goTo(ny,nm,dir,dx=0){
  y=ny;m=nm;
  const vp=curVp();
  vp.querySelectorAll(".leaving").forEach(e=>e.remove());
  const old=vp.firstElementChild,neu=build();
  setTitle(dir);counts(true);
  if(reduce||!old){vp.replaceChildren(neu);return}
  const op=+(old.style.opacity||1);old.style.transform=old.style.opacity="";
  old.classList.add("leaving");vp.classList.add("swapping");vp.appendChild(neu);
  const w=vp.offsetWidth;
  old.animate([{transform:`translateX(${dx}px)`,opacity:op},{transform:`translateX(${-dir*w*.55}px)`,opacity:0}],{duration:320,easing:EASE,fill:"forwards"}).onfinish=()=>old.remove();
  neu.animate([{transform:`translateX(${dir*w*.45}px)`,opacity:0},{transform:"none",opacity:1}],{duration:440,easing:EASE})
    .onfinish=()=>{if(!vp.querySelector(".leaving"))vp.classList.remove("swapping")};
}
function step(dir,dx){
  if(view==="year")return goTo(y+dir,m,dir,dx);
  let ny=y,nm=m+dir;if(nm<0){nm=11;ny--}if(nm>11){nm=0;ny++}
  goTo(ny,nm,dir,dx);
}
function swipe(el){
  let sx,sy,st,dx=0,pid=null,drag=false,blockUntil=0;
  const g=()=>el.matches(".vp")?el.firstElementChild:$("mvp").firstElementChild;
  el.addEventListener("pointerdown",e=>{if(e.button)return;pid=e.pointerId;sx=e.clientX;sy=e.clientY;st=e.timeStamp;dx=0;drag=false});
  el.addEventListener("pointermove",e=>{
    if(e.pointerId!==pid)return;
    const ddx=e.clientX-sx,ddy=e.clientY-sy;
    if(!drag){
      if(Math.abs(ddx)>8&&Math.abs(ddx)>Math.abs(ddy)*1.2){drag=true;try{el.setPointerCapture(pid)}catch(_){}(el.matches(".vp")?el:$("mvp")).classList.add("swapping")}
      else if(Math.abs(ddy)>10)pid=null;
      return;
    }
    dx=ddx;const w=el.offsetWidth,n=g();if(!n)return;
    n.style.transform=`translateX(${dx}px)`;n.style.opacity=1-Math.min(Math.abs(dx)/w,1)*.6;
  });
  const end=e=>{
    if(e.pointerId!==pid)return;pid=null;
    if(!drag)return;drag=false;blockUntil=performance.now()+400;
    const w=el.offsetWidth,v=Math.abs(dx)/(e.timeStamp-st||1);
    if(e.type!=="pointercancel"&&(Math.abs(dx)>w*.22||(v>.45&&Math.abs(dx)>30)))return step(dx<0?1:-1,dx);
    const n=g();if(!n)return;const op=+(n.style.opacity||1);n.style.transform=n.style.opacity="";
    n.animate([{transform:`translateX(${dx}px)`,opacity:op},{transform:"none",opacity:1}],{duration:420,easing:"cubic-bezier(.3,1.3,.5,1)"})
      .onfinish=()=>(el.matches(".vp")?el:$("mvp")).classList.remove("swapping");
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",e=>{if(performance.now()<blockUntil){e.stopPropagation();e.preventDefault()}},true);
}

/* Cambio Mes ↔ Año con zoom */
function flip(el,from,to,dur=480){
  el.animate([{transformOrigin:"0 0",transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width},${from.height/to.height})`},
              {transformOrigin:"0 0",transform:"none"}],{duration:dur,easing:"cubic-bezier(.2,.85,.25,1)"});
}
function moveInd(anim){
  const b=view==="month"?$("vMonth"):$("vYear"),ind=$("ind");
  if(!anim)ind.style.transition="none";
  ind.style.width=b.offsetWidth+"px";ind.style.transform=`translateX(${b.offsetLeft}px)`;
  if(!anim){ind.offsetWidth;ind.style.transition=""}
}
function setView(v,fromRect){
  if(v===view)return;
  const calRect=view==="month"?$("monthView").getBoundingClientRect():null;
  view=v;
  $("vMonth").setAttribute("aria-pressed",v==="month");$("vYear").setAttribute("aria-pressed",v==="year");
  moveInd(true);render();
  if(reduce)return;
  const fade=(els,delay)=>els.forEach(e=>e.animate([{opacity:0},{opacity:1}],{duration:280,delay,easing:"ease-out",fill:"backwards"}));
  if(v==="month"){
    const cal=$("monthView");
    if(fromRect)flip(cal,fromRect,cal.getBoundingClientRect());
    else cal.animate([{opacity:0,transform:"scale(.97)"},{opacity:1,transform:"none"}],{duration:360,easing:EASE});
    fade([...cal.children],fromRect?120:0);
  }else{
    const cards=[...$("yearView").querySelectorAll(".mini")],t=cards[m];
    cards.forEach((c,i)=>{if(c!==t)c.animate([{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"none"}],{duration:380,delay:80+Math.abs(i-m)*22,easing:EASE,fill:"backwards"})});
    t.classList.add("lift");flip(t,calRect,t.getBoundingClientRect());
    fade([...t.children],140);
    setTimeout(()=>t.classList.remove("lift"),500);
  }
}

function toggle(k,b){setType(k,marks.has(k)?null:"m",b)}
function setType(k,t,b){
  const prev=marks.get(k);
  if(prev===t)return;
  t?marks.set(k,t):marks.delete(k);
  storeLocal();
  if(b){
    // Al quitar se conserva el color anterior mientras se desvanece
    if(t){b.className=b.className.replace(/ t-\w+/g,"")+" t-"+t}
    b.classList.toggle("on",!!t);b.setAttribute("aria-pressed",!!t);counts(true);
    if(prev&&t&&!reduce)b.animate([{transform:"scale(.88)"},{transform:"none"}],{duration:500,easing:"cubic-bezier(.34,1.56,.64,1)"});
    try{navigator.vibrate&&navigator.vibrate(t?10:6)}catch(e){}
  }else render();
  save();
}
/* Mantener pulsado: menú para elegir tipo */
function holdable(b,k){
  let t=null,sx=0,sy=0;
  const cancel=()=>{clearTimeout(t);t=null};
  b.addEventListener("pointerdown",e=>{if(e.button)return;sx=e.clientX;sy=e.clientY;cancel();
    t=setTimeout(()=>{t=null;b._long=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}openPicker(k,b)},430)});
  b.addEventListener("pointermove",e=>{if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>8)cancel()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,cancel));
  b.addEventListener("contextmenu",e=>e.preventDefault());
}
function openPicker(k,b){
  const pk=$("pick"),bg=$("pickBg"),cur=marks.get(k);
  pk.innerHTML=TYPES.map(([t,n])=>`<button role="menuitem" data-t="${t}"><i class="sq t-${t}"></i>${n}${cur===t?'<span class="ck">✓</span>':""}</button>`).join("")
    +(cur?`<hr><button role="menuitem" data-t=""><i class="sq none"></i>Quitar</button>`:"");
  pk.hidden=bg.hidden=false;
  const r=b.getBoundingClientRect(),w=pk.offsetWidth,h=pk.offsetHeight;
  const left=Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12);
  const above=r.top-h-10>12,top=above?r.top-h-8:Math.min(r.bottom+8,innerHeight-h-12);
  pk.style.left=left+"px";pk.style.top=top+"px";
  pk.style.transformOrigin=`${r.left+r.width/2-left}px ${above?h:0}px`;
  if(!reduce)pk.animate([{opacity:0,transform:"scale(.85)"},{opacity:1,transform:"none"}],{duration:380,easing:"cubic-bezier(.34,1.4,.64,1)"});
  const close=()=>{if(pk.hidden)return;bg.hidden=true;
    if(reduce){pk.hidden=true;return}
    pk.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.92)"}],{duration:160,easing:"ease-in"}).onfinish=()=>pk.hidden=true};
  bg.onpointerdown=e=>{e.preventDefault();close()};
  pk.onclick=e=>{const o=e.target.closest("button");if(!o)return;close();setType(k,o.dataset.t||null,b)};
}
/* Sincronización con la nube (Vercel Blob vía /api/marks). Local = caché; "dirty" = cambios aún sin subir */
let DIRTY="mascara-luces-dirty";
let saveT=null,writing=false,again=false;
const isDirty=()=>{try{return localStorage.getItem(DIRTY)==="1"}catch(e){return false}};
const setDirty=v=>{try{v?localStorage.setItem(DIRTY,"1"):localStorage.removeItem(DIRTY)}catch(e){}};
function save(){setDirty(true);if(!location.protocol.startsWith("http"))return;clearTimeout(saveT);saveT=setTimeout(push,400)}
async function push(){
  if(writing){again=true;return}
  writing=true;
  try{
    const r=await fetch("/api/marks",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({days:toArr()})});
    if(r.status===401){writing=false;return showLogin()}
    if(!r.ok)throw 0;
    if(!again)setDirty(false);
    $("status").textContent="";
  }catch(e){$("status").textContent="Sin conexión: se guarda en este dispositivo y se subirá al volver."}
  writing=false;
  if(again){again=false;push()}
}
async function pull(){
  if(isDirty())return push();
  if(writing)return;
  try{
    const r=await fetch("/api/marks",{cache:"no-store"});if(r.status===401)return showLogin();if(!r.ok)return;
    const d=(await r.json()).days;
    if(isDirty()||writing)return;
    if(Array.isArray(d)){
      const nm=fromArr(d),same=nm.size===marks.size&&[...nm].every(([k,l])=>marks.get(k)===l);
      if(!same){marks=nm;storeLocal();render()}
    }else if(marks.size)push();
  }catch(e){}
}
$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(1);
$("todayBtn").onclick=()=>{
  const ny=now.getFullYear(),nm=now.getMonth();
  const d=view==="year"?Math.sign(ny-y):Math.sign((ny*12+nm)-(y*12+m));
  if(d)goTo(ny,nm,d);else if(view==="year"&&m!==nm)m=nm;
};
$("vMonth").onclick=()=>setView("month");
$("vYear").onclick=()=>setView("year");
swipe($("monthView"));swipe($("yearView"));
render();first=false;
moveInd(false);
document.fonts&&document.fonts.ready.then(()=>moveInd(false));
addEventListener("resize",()=>moveInd(false));
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});

/* Recordatorio push */
const b64=s=>{const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function initRemind(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||location.protocol!=="https:")return;
  const btn=$("remind"),reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  const show=on=>btn.setAttribute("aria-checked",on);
  show(!!sub&&Notification.permission==="granted");btn.hidden=false;
  if(sub)fetch("/api/subscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(sub)}).catch(()=>{});
  btn.onclick=async()=>{
    try{
      if(btn.getAttribute("aria-checked")==="true"){
        show(false);
        if(sub){fetch("/api/subscribe",{method:"DELETE",headers:{"content-type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});await sub.unsubscribe();sub=null}
        return;
      }
      show(true);
      if(await Notification.requestPermission()!=="granted"){show(false);$("status").textContent="Las notificaciones están bloqueadas en los ajustes del móvil.";return}
      const {publicKey}=await (await fetch("/api/vapid",{cache:"no-store"})).json();
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(publicKey)});
      const r=await fetch("/api/subscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(sub)});
      if(!r.ok)throw 0;
      $("status").textContent="";
    }catch(e){show(false);$("status").textContent="No se pudo activar el recordatorio. Inténtalo de nuevo."}
  };
}
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",e=>{
  if(e.data&&e.data.type==="marked"){const t=marks.get(e.data.day),n=t==="r"?"mr":t==="g"?"mg":t||"m";if(n!==t){marks.set(e.data.day,n);storeLocal();render()}}
});

/* Cuentas: login con Google (si está configurado). Cada usuario tiene sus datos en la nube y su caché local */
function useUser(u){
  user=u;
  try{localStorage.setItem(USER_LS,JSON.stringify(u))}catch(e){}
  LS=`${LEGACY_LS}:${u.sub}`;DIRTY=`mascara-luces-dirty:${u.sub}`;
  marks=new Map();
  try{
    let s=localStorage.getItem(LS);
    // Primera vez en este dispositivo: los días guardados antes del login pasan a esta cuenta (si la nube está vacía)
    if(s===null&&localStorage.getItem(LEGACY_LS)){s=localStorage.getItem(LEGACY_LS);localStorage.removeItem(LEGACY_LS);localStorage.removeItem("mascara-luces-dirty");localStorage.setItem(LS,s)}
    const a=JSON.parse(s||"[]");if(Array.isArray(a))marks=fromArr(a);
  }catch(e){}
  $("hello").textContent=`Hola ${u.name||""} :)`.replace("Hola  :)","Hola :)");
  const av=$("avatar");av.hidden=false;
  av.innerHTML=u.picture?`<img src="${u.picture}" alt="" referrerpolicy="no-referrer">`:(u.name||u.email||"?")[0].toUpperCase();
  render();
}
function showLogin(clientId){
  const l=$("login");
  if(!l.hidden)return;
  l.hidden=false;
  if(new URLSearchParams(location.search).get("login")==="error")$("loginErr").textContent="No se pudo iniciar sesión. Inténtalo de nuevo.";
  history.replaceState(null,"",location.pathname);
  const go=id=>{
    const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;
    s.onload=()=>{google.accounts.id.initialize({client_id:id,ux_mode:"redirect",login_uri:location.origin+"/api/login"});
      google.accounts.id.renderButton($("gbtn"),{theme:matchMedia("(prefers-color-scheme: dark)").matches?"filled_black":"outline",size:"large",shape:"pill",text:"continue_with",locale:"es",width:260})};
    s.onerror=()=>$("loginErr").textContent="Sin conexión. Conéctate para iniciar sesión.";
    document.head.appendChild(s);
  };
  if(clientId)go(clientId);else fetch("/api/me").then(r=>r.json()).then(m=>m.clientId&&go(m.clientId)).catch(()=>{});
}
async function logout(){
  try{
    const reg=await navigator.serviceWorker?.getRegistration();const sub=await reg?.pushManager?.getSubscription();
    if(sub){await fetch("/api/subscribe",{method:"DELETE",headers:{"content-type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}
  }catch(e){}
  await fetch("/api/logout",{method:"POST"}).catch(()=>{});
  try{localStorage.removeItem(USER_LS);localStorage.removeItem(LS);localStorage.removeItem(DIRTY)}catch(e){}
  location.replace("/");
}
$("avatar").onclick=()=>{
  const pk=$("pick"),bg=$("pickBg"),a=$("avatar").getBoundingClientRect();
  pk.innerHTML=`<button disabled style="opacity:1;cursor:default;font-size:13px;color:var(--muted)">${user?.email||""}</button><hr><button data-x="out">Cerrar sesión</button>`;
  pk.hidden=bg.hidden=false;
  pk.style.left=Math.max(12,a.right-pk.offsetWidth)+"px";pk.style.top=(a.bottom+8)+"px";pk.style.transformOrigin="100% 0";
  if(!reduce)pk.animate([{opacity:0,transform:"scale(.85)"},{opacity:1,transform:"none"}],{duration:380,easing:"cubic-bezier(.34,1.4,.64,1)"});
  const close=()=>{bg.hidden=pk.hidden=true};
  bg.onpointerdown=e=>{e.preventDefault();close()};
  pk.onclick=e=>{if(e.target.closest("[data-x=out]")){close();logout()}};
};
let started=false;
function start(){
  if(started)return;started=true;
  initRemind();
  pull();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
  addEventListener("online",pull);
}
if(location.protocol.startsWith("http")){
  // Arranque rápido con el usuario de la última vez; luego se confirma con el servidor
  try{const cu=JSON.parse(localStorage.getItem(USER_LS)||"null");if(cu&&cu.sub)useUser(cu)}catch(e){}
  fetch("/api/me",{cache:"no-store"}).then(r=>r.json()).then(me=>{
    if(!me.auth){start();return}
    if(!me.user){showLogin(me.clientId);return}
    if(!user||user.sub!==me.user.sub)useUser(me.user);else{user=me.user;try{localStorage.setItem(USER_LS,JSON.stringify(me.user))}catch(e){}}
    start();
  }).catch(()=>{if(user||!localStorage.getItem(USER_LS))start()}); // sin conexión: seguir con lo local
}
